server {
    listen 80;
    server_name localhost;

    # -------------------------------------------------------------
    # CAMADA PUBLICA: a vitrine estatica servida pelo proprio nginx
    # -------------------------------------------------------------
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # -------------------------------------------------------------
    # PROXY REVERSO -> CAMADA PRIVADA
    # /api/ e encaminhado para o conteiner "api" DENTRO da rede
    # interna. A API nao tem porta publicada: so se chega nela
    # passando por aqui.
    # -------------------------------------------------------------
    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://api:80/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts curtos: quando a API cai, o erro aparece em
        # segundos em vez dos 60s padrao (Tarefa 5).
        proxy_connect_timeout 3s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;
    }
}
